<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>CRM 主页 · Aus Granny Flat</title>
  <style>
    :root{--forest:#0d4b3c;--forest2:#176b52;--mint:#dcefe7;--ink:#17231f;--muted:#69776f;--line:#dfe7e3;--soft:#f5f8f7;--paper:#fff;--red:#c43e3e;--amber:#a75e14;--shadow:0 8px 30px rgba(13,75,60,.08)}
    *{box-sizing:border-box}html,body{height:100%}body{margin:0;color:var(--ink);background:var(--soft);font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif}a{text-decoration:none;color:inherit}button,input{font:inherit}
    .shell{min-height:100%;display:grid;grid-template-columns:68px 224px minmax(0,1fr);grid-template-rows:66px 1fr}.rail{grid-row:1/-1;background:linear-gradient(180deg,#0b493a,#07372d);display:flex;flex-direction:column;align-items:center;padding:13px 0;gap:8px;color:#fff;position:sticky;top:0;height:100vh;z-index:5}.rail-logo{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:#fff;color:var(--forest);font-weight:900;margin-bottom:13px}.rail-link{width:44px;height:44px;border-radius:11px;display:grid;place-items:center;color:#cce5dc;font-size:12px;font-weight:750;position:relative}.rail-link:hover,.rail-link.active{background:rgba(255,255,255,.16);color:#fff}.rail-link.active:before{content:"";position:absolute;left:-12px;top:9px;height:26px;width:3px;background:#79d7b7;border-radius:3px}.rail-bottom{margin-top:auto}
    .top{grid-column:2/-1;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 22px;background:#fff;gap:18px;position:sticky;top:0;z-index:4}.brand{font-size:19px;font-weight:850;color:var(--forest);min-width:205px}.brand small{display:block;font-size:10px;font-weight:600;color:#789087;margin-top:2px}.workspace{border:1px solid var(--line);border-radius:9px;background:#fff;padding:10px 14px;font-weight:750}.top-search{margin-left:auto;width:min(320px,30vw);border:1px solid var(--line);background:var(--soft);border-radius:9px;padding:10px 13px}.user{display:flex;align-items:center;gap:9px;font-size:13px}.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--mint);font-weight:800;color:var(--forest)}
    .side{grid-column:2;grid-row:2;padding:19px 14px;border-right:1px solid var(--line);background:#fbfdfc;position:sticky;top:66px;height:calc(100vh - 66px)}.side-title{font-size:17px;font-weight:850;margin:2px 8px 15px}.crm-nav{display:grid;gap:5px}.crm-nav a{display:flex;align-items:center;gap:9px;padding:10px;border-radius:9px;color:#35433e;font-size:13px;font-weight:700}.crm-nav a:hover{background:#edf6f2}.crm-nav a.active{background:var(--mint);color:var(--forest)}.side hr{border:0;border-top:1px solid var(--line);margin:18px 7px}.side-note{margin:0 8px;color:var(--muted);font-size:11px;line-height:1.55}.side-metric{display:flex;justify-content:space-between;margin:9px 8px;color:#45544e;font-size:12px}.side-metric b{color:var(--forest)}
    main{grid-column:3;grid-row:2;padding:28px 34px 48px;overflow:auto}.page{max-width:1080px;margin:0 auto}.eyebrow{font-size:12px;font-weight:800;color:var(--forest);margin-bottom:8px}.hero{display:flex;align-items:end;gap:20px;margin-bottom:24px}.hero h1{font-size:32px;font-weight:500;margin:0}.hero p{margin:0 0 4px;color:var(--muted);font-size:13px}.hero .date{margin-left:auto;color:var(--muted);font-size:13px}
    .brief{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px}.metric{background:#fff;border:1px solid var(--line);border-radius:12px;padding:15px;box-shadow:0 3px 14px rgba(13,75,60,.035)}.metric span{display:block;color:var(--muted);font-size:11px}.metric strong{display:block;color:var(--forest);font-size:25px;margin-top:4px}.metric.alert strong{color:var(--red)}
    .section{margin-top:24px}.section-head{display:flex;align-items:center;margin-bottom:10px}.section-head h2{margin:0;font-size:17px}.section-head span{color:var(--muted);font-size:12px;margin-left:7px}.section-head a{margin-left:auto;color:var(--forest);font-weight:750;font-size:12px}.panel{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
    .meeting{display:grid;grid-template-columns:76px 1fr auto;gap:14px;align-items:center;padding:15px 18px;border-bottom:1px solid var(--line)}.meeting:last-child{border-bottom:0}.meeting-time{font-size:13px;color:var(--forest);font-weight:800}.meeting-main{display:flex;align-items:center;gap:8px;min-width:0}.meeting-main strong{font-size:14px;white-space:nowrap;color:var(--ink)}.meeting-main p{margin:0;color:#c9823b;font-size:14px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.open-link{border:1px solid var(--line);border-radius:8px;padding:7px 10px;color:var(--forest);font-size:11px;font-weight:750}.open-link:hover{border-color:var(--forest)}
    .task{display:grid;grid-template-columns:30px minmax(0,1fr) 100px 130px;gap:12px;align-items:center;padding:13px 16px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .15s}.task:hover{background:#f2f8f5}.task:focus-visible{outline:2px solid var(--forest);outline-offset:-2px}.task:last-child{border-bottom:0}.task-dot{width:22px;height:22px;border:1px solid #9fb3aa;border-radius:50%;display:grid;place-items:center;color:var(--forest);font-size:11px}.task-main strong{font-size:13px}.task-main p{margin:3px 0 0;color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.priority{justify-self:start;padding:4px 8px;border-radius:999px;font-size:10px;font-weight:800;background:#edf4f1;color:var(--forest)}.priority.urgent{background:#ffebea;color:var(--red)}.priority.high{background:#fff1dc;color:var(--amber)}.due{text-align:right;color:var(--muted);font-size:11px}.due.overdue{color:var(--red);font-weight:750}.empty{padding:48px 20px;text-align:center;color:var(--muted)}.error{display:none;background:#ffebea;color:var(--red);padding:10px 13px;border-radius:8px;margin-bottom:14px}
    .tasks-only .meeting-section,.tasks-only .brief{display:none}.tasks-only .hero{margin-bottom:8px}.tasks-only #task-preview-link{display:none}
    @media(max-width:900px){.shell{grid-template-columns:60px 190px minmax(540px,1fr)}.brief{grid-template-columns:repeat(2,1fr)}.top-search{display:none}main{padding:22px}.task{grid-template-columns:28px minmax(0,1fr) 80px 100px}}
  </style>
</head>
<body>
  <div class="shell">
    <nav class="rail" aria-label="主功能"><a class="rail-logo" href="/crm/home">GF</a><a class="rail-link" href="/admin">客服</a><a class="rail-link active" href="/crm/home">CRM</a><a class="rail-link" href="/admin/old-number">旧号</a><a class="rail-link" href="/teach">教学</a><a class="rail-link rail-bottom" href="/api/admin/diagnostics">诊断</a></nav>
    <header class="top"><div class="brand">Aus Granny Flat<small>Build a Better Tomorrow</small></div><button class="workspace">销售 CRM　⌄</button><input class="top-search" id="search" placeholder="搜索任务或客户…" /><div class="user"><div class="avatar">AG</div><span>销售团队</span></div></header>
    <aside class="side"><div class="side-title">销售 CRM</div><nav class="crm-nav"><a id="nav-home" href="/crm/home">⌂ 首页</a><a href="/crm">◎ 客户</a><a id="nav-tasks" href="/crm/tasks">☑ 任务 <b id="side-task-count"></b></a></nav><hr><p class="side-note">AI 根据真实对话与客户资料确认销售阶段；任务与会议不会自动向客户发送消息。</p><div class="side-metric"><span>待处理</span><b id="side-open">0</b></div><div class="side-metric"><span>已逾期</span><b id="side-overdue">0</b></div><div class="side-metric"><span>重点客户</span><b id="side-hot">0</b></div></aside>
    <main id="main"><div class="page"><div class="error" id="error"></div><div class="eyebrow" id="eyebrow">CRM 每日简报</div><div class="hero"><div><h1 id="greeting">你好</h1><p id="subtitle">这是今天最需要关注的销售工作。</p></div><div class="date" id="date"></div></div><div class="brief"><div class="metric"><span>今日会议 / 跟进</span><strong id="m-meetings">0</strong></div><div class="metric"><span>待处理任务</span><strong id="m-tasks">0</strong></div><div class="metric alert"><span>逾期任务</span><strong id="m-overdue">0</strong></div><div class="metric"><span>重点客户</span><strong id="m-hot">0</strong></div></div><section class="section meeting-section"><div class="section-head"><h2>会议与跟进</h2><span>显示客服人工安排及今天的自动跟进</span></div><div class="panel" id="meetings"></div></section><section class="section"><div class="section-head"><h2 id="task-title">优先任务</h2><span id="task-count"></span><a id="task-preview-link" href="/crm/tasks">查看全部任务 →</a></div><div class="panel" id="tasks"></div></section></div></main>
  </div>
  <script>
    const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));const tasksOnly=location.pathname.endsWith('/tasks');let tasks=[],contacts=[];
    async function authFetch(url){const r=await fetch(url,{credentials:'same-origin'});if(r.status===401){location.href='/admin/login?next='+encodeURIComponent(location.pathname);throw new Error('login required')}return r}
    function customer(t){const c=t.contact||{};return c.name||c.whatsapp_profile_name||c.whatsapp_phone||'未命名客户'}function dueText(value){if(!value)return'未安排';const d=new Date(value);if(Number.isNaN(d.getTime()))return'未安排';return d.toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false})}function isToday(value){if(!value)return false;const d=new Date(value),n=new Date();return d.toDateString()===n.toDateString()}function prio(p){return p==='urgent'?'紧急':p==='high'?'高优先':'普通'}
    function filteredTasks(){const q=$('search').value.trim().toLowerCase();return tasks.filter(t=>!q||[t.title,t.reason,customer(t),t.contact?.whatsapp_phone].join(' ').toLowerCase().includes(q))}
    function render(){const list=filteredTasks(),todayMeetings=tasks.filter(t=>t.kind==='follow_up'&&isToday(t.due_at)),manualPlans=tasks.filter(t=>t.manual&&(t.kind==='follow_up'||t.kind==='manual_action')),scheduled=[...new Map([...todayMeetings,...manualPlans].map(t=>[t.id,t])).values()].sort((a,b)=>(a.due_at||'9999').localeCompare(b.due_at||'9999'));const overdue=tasks.filter(t=>t.overdue).length,hot=contacts.filter(c=>c.lead_temperature==='hot'&&c.sales_stage!=='closed').length;$('side-task-count').textContent=tasks.length;$('side-open').textContent=tasks.length;$('side-overdue').textContent=overdue;$('side-hot').textContent=hot;$('m-meetings').textContent=todayMeetings.length;$('m-tasks').textContent=tasks.length;$('m-overdue').textContent=overdue;$('m-hot').textContent=hot;$('meetings').innerHTML=scheduled.length?scheduled.slice(0,8).map(t=>`<div class="meeting"><div class="meeting-time">${esc(t.due_at?dueText(t.due_at):'待安排')}</div><div class="meeting-main"><strong>${esc(t.action_type==='meeting'?'会议':'跟进')} · ${esc(customer(t))}</strong><p>${esc(t.reason||'按计划继续跟进')}</p></div><a class="open-link" href="/admin?session=${encodeURIComponent(t.session_id)}">打开对话</a></div>`).join(''):'<div class="empty">暂无人工安排的会议或跟进</div>';const shown=tasksOnly?list:list.slice(0,7);$('task-count').textContent=`· ${list.length}`;$('tasks').innerHTML=shown.length?shown.map(t=>`<a class="task" href="/admin?session=${encodeURIComponent(t.session_id)}" aria-label="打开 ${esc(customer(t))} 的客服对话"><span class="task-dot">✓</span><div class="task-main"><strong>${esc(t.title)} · ${esc(customer(t))}</strong><p>${esc(t.reason||'')}</p></div><span class="priority ${esc(t.priority)}">${esc(prio(t.priority))}</span><span class="due ${t.overdue?'overdue':''}">${esc(dueText(t.due_at))}</span></a>`).join(''):'<div class="empty">没有符合条件的任务</div>'}
    async function load(){try{const[tr,cr]=await Promise.all([authFetch('/api/tasks'),authFetch('/api/contacts')]);tasks=(await tr.json()).tasks||[];contacts=(await cr.json()).contacts||[];$('error').style.display='none';render()}catch(e){$('error').textContent='CRM 数据加载失败，请刷新页面。';$('error').style.display='block'}}
    const now=new Date();$('date').textContent=now.toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric',weekday:'long'});$('greeting').textContent=`${now.getHours()<12?'早上好':now.getHours()<18?'下午好':'晚上好'}`;if(tasksOnly){document.body.classList.add('tasks-only');document.title='CRM 任务 · Aus Granny Flat';$('nav-tasks').classList.add('active');$('eyebrow').textContent='CRM 任务中心';$('greeting').textContent='销售任务';$('subtitle').textContent='按优先级处理客户回复、人工检查与跟进。';$('task-title').textContent='全部任务'}else{$('nav-home').classList.add('active')}$('search').oninput=render;(async()=>{const r=await fetch('/api/admin/session',{credentials:'same-origin'});if(r.ok){const s=await r.json();if(s.auth_required&&!s.authenticated){location.href='/admin/login?next='+encodeURIComponent(location.pathname);return}}await load()})();
  </script>
</body>
</html>
