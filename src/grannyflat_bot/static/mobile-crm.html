<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#075e54" />
  <title>CRM 首页 · Aus Granny Flat</title>
  <style>
    :root{--green:#008069;--deep:#075e54;--mint:#e7f5ef;--bg:#f4f7f6;--ink:#17231f;--muted:#6d7a75;--line:#dfe7e3;--red:#c43e3e;--amber:#a75e14}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}body{padding-bottom:env(safe-area-inset-bottom)}button,a{font:inherit}a{text-decoration:none;color:inherit}.app{min-height:100vh}.topbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:4px;height:calc(48px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 8px 0;background:var(--deep);color:#fff;box-shadow:0 1px 4px #0003}.back{width:40px;height:40px;border:0;border-radius:50%;background:transparent;color:#fff;font-size:27px}.title{flex:1;min-width:0;font-size:16px;font-weight:700}.title small{display:inline;margin-left:7px;font-size:10px;font-weight:400;opacity:.78}.content{padding:13px 14px 90px;max-width:720px;margin:auto}.greeting{margin:0 2px 12px}.greeting .eyebrow{color:var(--green);font-size:11px;font-weight:800}.greeting h1{margin:2px 0;font-size:25px;font-weight:500}.greeting p{margin:0;color:var(--muted);font-size:12px}.metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-bottom:16px}.metric{background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 13px}.metric span{display:block;color:var(--muted);font-size:11px}.metric strong{display:block;color:var(--deep);font-size:23px;margin-top:1px}.metric.alert strong{color:var(--red)}.section{margin-top:16px}.section-head{display:flex;align-items:center;margin:0 2px 9px}.section-head h2{margin:0;font-size:17px}.section-head span{margin-left:6px;color:var(--muted);font-size:11px}.panel{overflow:hidden;background:#fff;border:1px solid var(--line);border-radius:13px}.meeting,.task{display:grid;grid-template-columns:62px minmax(0,1fr);gap:10px;padding:13px;border-bottom:1px solid var(--line)}.meeting:last-child,.task:last-child{border-bottom:0}.meeting-time{color:var(--green);font-size:12px;font-weight:800;padding-top:2px}.meeting-main{min-width:0}.meeting-main strong,.meeting-main p{display:inline}.meeting-main strong{color:var(--ink)}.meeting-main p{color:#c9823b}.meeting-main strong,.task-main strong{font-size:13px}.meeting-main p{margin:0;font-size:13px;font-weight:700;line-height:1.45}.task-main p{margin:3px 0 0;color:var(--muted);font-size:11px;line-height:1.45}.task{grid-template-columns:26px minmax(0,1fr) auto;align-items:start}.task-dot{width:21px;height:21px;border:1px solid #9fb3aa;border-radius:50%;display:grid;place-items:center;color:var(--green);font-size:11px}.task-main{min-width:0}.priority{padding:4px 7px;border-radius:999px;background:#edf4f1;color:var(--green);font-size:10px;font-weight:800;white-space:nowrap}.priority.urgent{background:#ffebea;color:var(--red)}.priority.high{background:#fff1dc;color:var(--amber)}.open{display:block;color:var(--green);font-size:11px;font-weight:700;margin-top:7px}.empty{padding:28px 14px;text-align:center;color:var(--muted);font-size:13px}.error{display:none;padding:10px;border-radius:9px;background:#ffebea;color:var(--red);font-size:12px;margin-bottom:12px}.bottom-nav{position:fixed;left:0;right:0;bottom:0;display:flex;padding:7px 10px calc(7px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line);z-index:4}.bottom-nav a{flex:1;text-align:center;color:var(--muted);font-size:11px;font-weight:700}.bottom-nav a.active{color:var(--green)}.bottom-nav b{display:block;font-size:18px;line-height:20px}
  </style>
</head>
<body>
  <div class="app"><header class="topbar"><button class="back" id="back" aria-label="返回客服">‹</button><div class="title">CRM 首页<small>会议与待办事项</small></div></header><main class="content"><div class="error" id="error"></div><section class="greeting"><div class="eyebrow">CRM 每日简报</div><h1 id="greeting">你好</h1><p id="date"></p></section><section class="metrics"><div class="metric"><span>今日会议 / 跟进</span><strong id="meet-count">0</strong></div><div class="metric"><span>待办事项</span><strong id="task-count">0</strong></div><div class="metric alert"><span>逾期</span><strong id="overdue-count">0</strong></div><div class="metric"><span>重点客户</span><strong id="hot-count">0</strong></div></section><section class="section"><div class="section-head"><h2>会议与跟进</h2><span>今天</span></div><div class="panel" id="meetings"></div></section><section class="section"><div class="section-head"><h2>待办事项</h2></div><div class="panel" id="tasks"></div></section></main><nav class="bottom-nav" aria-label="移动端导航"><a href="/m/crm/home" class="active"><b>⌂</b>CRM 首页</a><a href="/m/chat"><b>▣</b>客服聊天</a></nav></div>
  <script>
    const $=id=>document.getElementById(id);let tasks=[],contacts=[];const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));function name(t){const c=t.contact||{};return c.name||c.whatsapp_profile_name||c.whatsapp_phone||'未命名客户'}function due(v){if(!v)return'待安排';const d=new Date(v);return Number.isNaN(d.getTime())?'待安排':d.toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false})}function today(v){if(!v)return false;return new Date(v).toDateString()===new Date().toDateString()}function priority(v){return v==='urgent'?'紧急':v==='high'?'高优先':'普通'}function render(){const todayItems=tasks.filter(t=>t.kind==='follow_up'&&today(t.due_at)),manualItems=tasks.filter(t=>t.manual&&(t.kind==='follow_up'||t.kind==='manual_action')),mt=[...new Map([...todayItems,...manualItems].map(t=>[t.id,t])).values()].sort((a,b)=>(a.due_at||'9999').localeCompare(b.due_at||'9999')),overdue=tasks.filter(t=>t.overdue).length,hot=contacts.filter(c=>c.lead_temperature==='hot'&&c.sales_stage!=='closed').length;$('meet-count').textContent=todayItems.length;$('task-count').textContent=tasks.length;$('overdue-count').textContent=overdue;$('hot-count').textContent=hot;$('meetings').innerHTML=mt.length?mt.slice(0,8).map(t=>`<div class="meeting"><div class="meeting-time">${esc(due(t.due_at))}</div><div class="meeting-main"><strong>${esc(t.action_type==='meeting'?'会议':'跟进')} · ${esc(name(t))}</strong><p>${esc(t.reason||'按计划继续跟进')}</p><a class="open" href="/m/chat?session=${encodeURIComponent(t.session_id)}">打开客户对话 →</a></div></div>`).join(''):'<div class="empty">暂无人工安排的会议或跟进</div>';$('tasks').innerHTML=tasks.slice(0,8).map(t=>`<a class="task" href="/m/chat?session=${encodeURIComponent(t.session_id)}" aria-label="打开 ${esc(name(t))} 的客服对话"><span class="task-dot">✓</span><div class="task-main"><strong>${esc(t.title)} · ${esc(name(t))}</strong><p>${esc(t.reason||'')}</p><span class="open">打开对话 · ${esc(due(t.due_at))}</span></div><span class="priority ${esc(t.priority)}">${esc(priority(t.priority))}</span></a>`).join('')||'<div class="empty">暂无待办事项</div>'}async function load(){try{const[a,b]=await Promise.all([fetch('/api/tasks',{credentials:'same-origin'}),fetch('/api/contacts',{credentials:'same-origin'})]);if(a.status===401||b.status===401){location.href='/admin/login?next='+encodeURIComponent('/m/crm/home');return}tasks=(await a.json()).tasks||[];contacts=(await b.json()).contacts||[];render()}catch(e){$('error').textContent='CRM 数据加载失败，请刷新页面。';$('error').style.display='block'}}const now=new Date();$('date').textContent=now.toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric',weekday:'long'});$('greeting').textContent=now.getHours()<12?'早上好':now.getHours()<18?'下午好':'晚上好';$('back').onclick=()=>location.href='/m/chat';load();
  </script>
</body>
</html>
