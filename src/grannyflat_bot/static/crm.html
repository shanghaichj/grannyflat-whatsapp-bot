<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>销售 CRM · Aus Granny Flat</title>
  <style>
    :root{--forest:#0d4b3c;--forest-2:#176b52;--green:#238b69;--mint:#e7f5ef;--ink:#16251f;--muted:#64736d;--line:#dfe8e4;--soft:#f5f8f7;--paper:#fff;--red:#c43e3e;--red-bg:#ffebea;--amber:#a75e14;--amber-bg:#fff1dc;--blue:#315f9c;--blue-bg:#e8f0ff;--shadow:0 10px 32px rgba(13,75,60,.08)}
    *{box-sizing:border-box}html,body{height:100%}body{margin:0;color:var(--ink);background:#fff;font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;overflow:hidden}button,input,select,textarea{font:inherit}a{text-decoration:none;color:inherit}button{cursor:pointer}
    .shell{height:100%;display:grid;grid-template-columns:68px 224px 386px minmax(520px,1fr);grid-template-rows:66px 1fr}.rail{grid-row:1/-1;background:linear-gradient(180deg,#0b493a,#07372d);display:flex;flex-direction:column;align-items:center;padding:13px 0;gap:8px;color:#fff;z-index:5}.rail-logo{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:#fff;color:var(--forest);font-weight:900;margin-bottom:13px}.rail-link{width:44px;height:44px;border-radius:11px;display:grid;place-items:center;color:#cce5dc;font-size:12px;font-weight:750;position:relative}.rail-link:hover,.rail-link.active{background:rgba(255,255,255,.16);color:#fff}.rail-link.active:before{content:"";position:absolute;left:-12px;top:9px;height:26px;width:3px;background:#79d7b7;border-radius:3px}.rail-bottom{margin-top:auto}
    .top{grid-column:2/-1;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 22px;background:#fff;gap:18px}.brand{font-size:19px;font-weight:850;color:var(--forest);min-width:205px}.brand small{display:block;font-size:10px;font-weight:600;color:#789087;margin-top:2px}.workspace-picker{border:1px solid var(--line);border-radius:9px;background:#fff;padding:10px 14px;font-weight:750;min-width:160px;text-align:left}.top-search{margin-left:auto;width:min(300px,28vw);border:1px solid var(--line);background:var(--soft);border-radius:9px;padding:10px 13px}.user{display:flex;align-items:center;gap:9px;font-size:13px}.user-avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--mint);font-weight:800;color:var(--forest)}
    .queues{grid-column:2;grid-row:2;padding:19px 14px;border-right:1px solid var(--line);background:#fbfdfc;overflow:auto}.side-title{font-size:17px;font-weight:850;margin:2px 8px 15px}.side-section{margin-bottom:20px}.side-section h3{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:0 9px;margin:0 0 7px}.queue{width:100%;border:0;background:transparent;border-radius:9px;padding:9px 10px;display:flex;align-items:center;gap:9px;color:#35433e;text-align:left}.queue:hover{background:#edf6f2}.queue.active{background:#dcefe7;color:var(--forest);font-weight:800}.queue .ico{width:18px;text-align:center}.queue .count{margin-left:auto;font-size:12px;font-variant-numeric:tabular-nums}.queue.danger .count{color:var(--red)}.side-line{border:0;border-top:1px solid var(--line);margin:15px 7px}.legacy-card{margin:18px 7px 0;padding:13px;border:1px solid #d3e5de;border-radius:12px;background:linear-gradient(145deg,#e8f4ef,#f9fbfa)}.legacy-card strong{display:block;font-size:13px;margin-bottom:5px}.legacy-card p{font-size:11px;line-height:1.5;color:var(--muted);margin:0 0 9px}.legacy-card a{display:inline-flex;color:var(--forest);font-size:12px;font-weight:800}
    .crm-section-nav{display:grid;gap:5px;margin-bottom:18px}.crm-section-nav a{display:flex;align-items:center;gap:9px;padding:10px;border-radius:9px;color:#35433e;font-size:13px;font-weight:700}.crm-section-nav a:hover{background:#edf6f2}.crm-section-nav a.active{background:#dcefe7;color:var(--forest)}
    .inbox{grid-column:3;grid-row:2;border-right:1px solid var(--line);display:flex;min-width:0;flex-direction:column;background:#fff}.inbox-tools{padding:16px 13px 12px;border-bottom:1px solid var(--line)}.search-row{display:flex;gap:8px}.search-row input{width:100%;min-width:0;border:1px solid var(--line);border-radius:9px;padding:10px 12px;background:#fff}.filter-btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:0 12px}.sort-row{display:flex;align-items:center;margin-top:11px;color:var(--muted);font-size:12px}.sort-row select{border:0;background:transparent;color:var(--forest);font-weight:750;margin-left:5px}.sort-row span:last-child{margin-left:auto}.lead-list{overflow:auto;flex:1;padding:7px}.lead-card{width:100%;border:1px solid transparent;background:#fff;border-radius:11px;padding:13px 12px;display:grid;grid-template-columns:43px minmax(0,1fr) auto;gap:10px;text-align:left;margin-bottom:5px;color:inherit}.lead-card:hover{background:#f5faf8}.lead-card.active{background:#edf8f3;border-color:#c5e4d7;box-shadow:inset 3px 0 0 var(--green)}.avatar{width:43px;height:43px;border-radius:50%;display:grid;place-items:center;background:#375f55;color:#fff;font-weight:800}.lead-main{min-width:0}.lead-name-row{display:flex;gap:6px;align-items:center}.lead-name{font-size:14px;font-weight:850;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.lead-phone,.lead-place,.lead-next{font-size:11px;color:var(--muted);margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.lead-next{color:#374b43}.lead-time{font-size:10px;color:var(--muted);white-space:nowrap}.badge{display:inline-flex;align-items:center;padding:3px 7px;border-radius:999px;font-size:10px;font-weight:800;white-space:nowrap}.badge.hot,.badge.urgent{background:var(--red-bg);color:var(--red)}.badge.warm,.badge.high{background:var(--amber-bg);color:var(--amber)}.badge.cold{background:var(--blue-bg);color:var(--blue)}.badge.non_target{background:#eceff1;color:#455a64}.list-empty{padding:55px 18px;color:var(--muted);text-align:center}
    .detail{grid-column:4;grid-row:2;overflow:auto;background:var(--soft);min-width:0}.detail-empty{height:100%;display:grid;place-items:center;color:var(--muted);text-align:center}.detail-empty b{display:block;color:var(--forest);font-size:18px;margin-bottom:7px}.person-head{background:#fff;border-bottom:1px solid var(--line);padding:18px 22px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:3}.person-head .avatar{width:58px;height:58px;font-size:18px;background:var(--forest)}.person-info{min-width:0}.person-info h1{font-size:23px;margin:0 0 6px}.person-sub{font-size:12px;color:var(--muted)}.person-badges{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap}.head-actions{margin-left:auto;display:flex;gap:8px;align-items:center}.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px 12px;font-weight:750;font-size:12px}.btn:hover{border-color:var(--green)}.btn.primary{background:var(--forest);border-color:var(--forest);color:#fff}.btn.primary:hover{background:#073a2e}.btn.done{color:var(--forest)}
    .detail-body{padding:15px;display:grid;grid-template-columns:minmax(290px,1.08fr) minmax(270px,.92fr);gap:13px;align-items:start}.card{background:#fff;border:1px solid var(--line);border-radius:13px;padding:16px;box-shadow:0 3px 15px rgba(13,75,60,.035)}.card.wide{grid-column:1/-1}.card h2{font-size:15px;margin:0 0 14px;display:flex;align-items:center;gap:7px}.card h2 span:last-child{margin-left:auto;color:var(--muted);font-size:11px;font-weight:500}.overview{display:grid;grid-template-columns:1fr 1fr;gap:12px 20px}.prop label,.field label{display:block;color:var(--muted);font-size:10px;font-weight:750;margin-bottom:4px}.prop div{font-size:13px}.summary{background:linear-gradient(145deg,#eff9f5,#f8fbfa);border-radius:10px;padding:13px;line-height:1.68;font-size:13px;min-height:92px}.summary-foot{font-size:10px;color:var(--muted);margin-top:8px}.field{margin-bottom:10px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px;background:#fff}.field textarea{min-height:68px;resize:vertical}.auto-row{display:flex;flex-wrap:wrap;gap:9px;color:var(--muted);font-size:10px;margin:4px 0 12px}.action-bar{display:flex;gap:7px;align-items:center}.save-state{font-size:11px;color:var(--muted);margin-left:auto}.missing{display:flex;gap:7px;flex-wrap:wrap}.missing .chip{background:var(--amber-bg);color:var(--amber);border-radius:8px;padding:8px 10px;font-size:11px;font-weight:750}.timeline{list-style:none;padding:0;margin:0}.timeline li{position:relative;padding:0 0 15px 22px;font-size:12px}.timeline li:before{content:"";position:absolute;left:3px;top:4px;width:8px;height:8px;border-radius:50%;background:var(--green)}.timeline li:after{content:"";position:absolute;left:6px;top:14px;width:2px;height:calc(100% - 8px);background:#dbe7e2}.timeline li:last-child:after{display:none}.timeline time{display:block;color:var(--muted);font-size:10px;margin-top:3px}.history-text{color:#4c5f57;margin-top:3px;line-height:1.4}.error-banner{display:none;padding:10px 15px;background:var(--red-bg);color:var(--red);font-size:12px}
    @media(max-width:1180px){.shell{grid-template-columns:62px 190px 340px minmax(460px,1fr)}.detail-body{grid-template-columns:1fr}.card.wide{grid-column:auto}.top-search{display:none}}@media(max-width:880px){body{overflow:auto}.shell{height:auto;min-height:100%;grid-template-columns:60px 240px minmax(0,1fr);grid-template-rows:62px 440px auto}.top{grid-column:2/-1}.queues{grid-column:2;grid-row:2}.inbox{grid-column:3;grid-row:2}.detail{grid-column:2/-1;grid-row:3;min-height:600px}.person-head{position:static}.brand{min-width:150px}.user{display:none}}
    .avatar.priority-level-1{background:linear-gradient(145deg,#90a4ae,#546e7a)}
    .avatar.priority-level-2{background:linear-gradient(145deg,#7986cb,#3f51b5)}
    .avatar.priority-level-3{background:linear-gradient(145deg,#42a5f5,#1565c0)}
    .avatar.priority-level-4{background:linear-gradient(145deg,#26c6da,#00838f)}
    .avatar.priority-level-5{background:linear-gradient(145deg,#26a69a,#00695c)}
    .avatar.priority-level-6{background:linear-gradient(145deg,#66bb6a,#2e7d32)}
    .avatar.priority-level-7{background:linear-gradient(145deg,#9e9d24,#6d6b12)}
    .avatar.priority-level-8{background:linear-gradient(145deg,#ffb74d,#ef6c00)}
    .avatar.priority-level-9{background:linear-gradient(145deg,#ff7043,#d84315)}
    .avatar.priority-level-10{background:linear-gradient(145deg,#ef5350,#b71c1c)}
  </style>
</head>
<body>
  <div class="shell">
    <nav class="rail" aria-label="主功能"><a class="rail-logo" href="/crm/home" title="Aus Granny Flat">GF</a><a class="rail-link" href="/admin" title="客服工作台">客服</a><a class="rail-link active" href="/crm/home" title="销售 CRM">CRM</a><a class="rail-link" href="/admin/old-number" title="老号码独立入口">旧号</a><a class="rail-link" href="/teach" title="教模型">教学</a><a class="rail-link rail-bottom" href="/api/admin/diagnostics" title="系统诊断">诊断</a></nav>
    <header class="top"><div class="brand">Aus Granny Flat<small>Build a Better Tomorrow</small></div><button class="workspace-picker" id="workspace-picker" title="点击切换数据来源">新号码　⌄</button><input class="top-search" id="global-search" placeholder="搜索全部客户…" /><div class="user"><div class="user-avatar">AG</div><span>销售团队</span></div></header>
    <aside class="queues"><div class="side-title">销售 CRM</div><nav class="crm-section-nav" aria-label="CRM 功能"><a href="/crm/home">⌂ 首页</a><a class="active" href="/crm">◎ 客户</a><a href="/crm/tasks">☑ 任务</a></nav><hr class="side-line" /><div class="side-section" id="queue-list"><h3>优先级</h3><button class="queue active" data-queue="reply"><span class="ico">▣</span><span>待回复</span><span class="count" id="count-reply">0</span></button><button class="queue" data-queue="hot"><span class="ico">◆</span><span>重点客户</span><span class="count" id="count-hot">0</span></button><button class="queue" data-queue="warm"><span class="ico">◇</span><span>意向客户</span><span class="count" id="count-warm">0</span></button><button class="queue" data-queue="cold"><span class="ico">○</span><span>咨询客户</span><span class="count" id="count-cold">0</span></button><button class="queue" data-queue="non_target"><span class="ico">–</span><span>非目标客户</span><span class="count" id="count-non-target">0</span></button><button class="queue" data-queue="today"><span class="ico">◈</span><span>今日跟进</span><span class="count" id="count-today">0</span></button><button class="queue danger" data-queue="overdue"><span class="ico">!</span><span>逾期</span><span class="count" id="count-overdue">0</span></button><button class="queue" data-queue="all"><span class="ico">◎</span><span>全部客户</span><span class="count" id="count-all">0</span></button><button class="queue" data-queue="completed"><span class="ico">✓</span><span>已完成</span><span class="count" id="count-completed">0</span></button></div><hr class="side-line" /><div class="side-section"><h3>销售阶段</h3><div id="stage-list"></div></div></aside>
    <section class="inbox"><div class="inbox-tools"><div class="search-row"><input id="search" type="search" placeholder="搜索客户" /><button class="filter-btn" id="filter-toggle" title="只看有跟进日期的客户">筛选</button></div><div class="sort-row"><span>排序：</span><select id="sort"><option value="priority">优先级最高</option><option value="recent">最近活动</option><option value="score">资格分最高</option></select><span id="result-count">0 位客户</span></div></div><div class="error-banner" id="error"></div><div class="lead-list" id="lead-list"></div></section>
    <main class="detail" id="detail"><div class="detail-empty"><div><b>销售 CRM</b>从左侧优先级选择客户，查看销售资料与下一步行动。</div></div></main>
  </div>
  <script>
    const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));const requestedSession=new URLSearchParams(location.search).get('session');let contacts=[],tasks=[],stages=[],selected=null,queue='reply',followupOnly=false,source='new';
    const api=p=>source==='legacy'?'/api/legacy'+p:'/api'+p;const chatUrl=id=>source==='legacy'?`/admin/old-number?session=${encodeURIComponent(id)}`:`/admin?session=${encodeURIComponent(id)}`;
    async function authFetch(url,options={}){const r=await fetch(url,{credentials:'same-origin',...options});if(r.status===401){location.href='/admin/login?next='+encodeURIComponent('/crm');throw new Error('login required')}return r}
    function initials(c){const n=(c.name||c.whatsapp_profile_name||'客户').trim();return n.split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase().slice(0,2)}function when(v){if(!v)return'未安排';const d=new Date(v);if(Number.isNaN(d.getTime()))return'未安排';const delta=Date.now()-d.getTime();if(delta<0&&-delta<86400000)return`${Math.max(1,Math.ceil(-delta/3600000))} 小时后`;if(delta>=0&&delta<86400000)return`${Math.max(1,Math.floor(delta/3600000))} 小时前`;return d.toLocaleDateString('zh-CN',{month:'2-digit',day:'2-digit'})}function isoLocal(v){if(!v)return'';const d=new Date(v);if(Number.isNaN(d.getTime()))return'';const z=n=>String(n).padStart(2,'0');return`${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}T${z(d.getHours())}:${z(d.getMinutes())}`}function today(v){if(!v)return false;const d=new Date(v),n=new Date();return d.getFullYear()===n.getFullYear()&&d.getMonth()===n.getMonth()&&d.getDate()===n.getDate()}function replyIds(){return new Set(tasks.filter(t=>t.kind==='reply_customer').map(t=>t.session_id))}
    function priority(c){const r=replyIds();if(r.has(c.session_id))return 1000;if(c.follow_up_due_at&&Date.parse(c.follow_up_due_at)<Date.now())return 900;if(c.lead_temperature==='hot')return 700+(c.qualification_score||0);if(c.lead_temperature==='warm')return 400+(c.qualification_score||0);return c.qualification_score||0}
    function avatarPriorityLevel(c){const score=Math.max(0,Math.min(100,Number(c&&c.qualification_score)||0)),scoreLevel=Math.max(1,Math.min(10,Math.ceil(score/10))),p=c&&c.lead_temperature;if(p==='non_target')return 1;if(p==='cold')return Math.min(4,scoreLevel);if(p==='warm')return Math.max(5,Math.min(7,scoreLevel));if(p==='hot')return Math.max(8,scoreLevel);return scoreLevel}
    function avatarClass(c){return`avatar priority-level-${avatarPriorityLevel(c)}`}
    function visibleContacts(){const now=Date.now(),replies=replyIds();let list=contacts.filter(c=>{if(queue==='reply'&&!replies.has(c.session_id))return false;if(['hot','warm','cold','non_target'].includes(queue)&&c.lead_temperature!==queue)return false;if(queue==='today'&&!today(c.follow_up_due_at))return false;if(queue==='overdue'&&(!c.follow_up_due_at||Date.parse(c.follow_up_due_at)>=now))return false;if(queue==='completed'&&c.sales_stage!=='closed')return false;if(queue.startsWith('stage:')&&c.sales_stage!==queue.slice(6))return false;if(queue!=='completed'&&c.sales_stage==='closed')return false;if(followupOnly&&!c.follow_up_due_at)return false;const q=$('search').value.trim().toLowerCase();if(q&&![(c.name||''),(c.whatsapp_phone||''),(c.location_summary||''),(c.next_action||''),(c.last_message||'')].join(' ').toLowerCase().includes(q))return false;return true});const mode=$('sort').value;return list.sort((a,b)=>mode==='score'?(b.qualification_score||0)-(a.qualification_score||0):mode==='recent'?Date.parse(b.updated_at||0)-Date.parse(a.updated_at||0):priority(b)-priority(a))}
    function updateCounts(){const now=Date.now();$('count-reply').textContent=replyIds().size;$('count-hot').textContent=contacts.filter(c=>c.lead_temperature==='hot'&&c.sales_stage!=='closed').length;$('count-warm').textContent=contacts.filter(c=>c.lead_temperature==='warm'&&c.sales_stage!=='closed').length;$('count-cold').textContent=contacts.filter(c=>c.lead_temperature==='cold'&&c.sales_stage!=='closed').length;$('count-non-target').textContent=contacts.filter(c=>c.lead_temperature==='non_target'&&c.sales_stage!=='closed').length;$('count-today').textContent=contacts.filter(c=>today(c.follow_up_due_at)&&c.sales_stage!=='closed').length;$('count-overdue').textContent=contacts.filter(c=>c.follow_up_due_at&&Date.parse(c.follow_up_due_at)<now&&c.sales_stage!=='closed').length;$('count-all').textContent=contacts.filter(c=>c.sales_stage!=='closed').length;$('count-completed').textContent=contacts.filter(c=>c.sales_stage==='closed').length;$('stage-list').innerHTML=stages.filter(s=>s.code!=='closed').map(s=>`<button class="queue ${queue==='stage:'+s.code?'active':''}" data-queue="stage:${esc(s.code)}"><span class="ico">○</span><span>${esc(s.label)}</span><span class="count">${contacts.filter(c=>c.sales_stage===s.code).length}</span></button>`).join('');document.querySelectorAll('#queue-list .queue').forEach(b=>b.classList.toggle('active',b.dataset.queue===queue))}
    function renderList(){updateCounts();const list=visibleContacts();$('result-count').textContent=`${list.length} 位客户`;$('lead-list').innerHTML=list.length?list.map(c=>`<button class="lead-card ${selected?.session_id===c.session_id?'active':''}" data-id="${esc(c.session_id)}"><span class="${avatarClass(c)}">${esc(initials(c))}</span><span class="lead-main"><span class="lead-name-row"><span class="lead-name">${esc(c.name||c.whatsapp_phone||'未命名')}</span><span class="badge ${esc(c.lead_temperature||'cold')}">${esc(c.lead_temperature_label||'咨询客户')}</span></span><span class="lead-phone">${esc(c.whatsapp_phone||'无电话')}</span><span class="lead-place">⌖ ${esc(c.location_summary||'地区未知')}</span><span class="lead-next">▣ ${esc(c.next_action||'确认客户需求')}</span></span><span class="lead-time">${esc(when(c.updated_at))}</span></button>`).join(''):'<div class="list-empty">当前优先级暂无客户</div>'}
    function req(c,key,fallback='—'){const v=c.requirements?.[key]??c.questionnaire?.[key];return v===null||v===undefined||v===''?fallback:v}function budget(c){const lo=req(c,'budget_aud_min',''),hi=req(c,'budget_aud_max','');if(lo&&hi)return`$${Number(lo).toLocaleString()}–$${Number(hi).toLocaleString()}`;if(hi)return`最高 $${Number(hi).toLocaleString()}`;if(lo)return`约 $${Number(lo).toLocaleString()}`;return'待确认'}function historyItems(c){const items=(c.history||[]).slice(-4).reverse();if(!items.length)return'<li><b>尚无活动记录</b></li>';return items.map(m=>`<li><b>${m.role==='user'?'收到 WhatsApp 咨询':m.role==='assistant'?'机器人完成回复':'客服活动'}</b><div class="history-text">${esc(String(m.content||'').slice(0,96))}${String(m.content||'').length>96?'…':''}</div><time>${esc(when(m.at))}</time></li>`).join('')}
    function renderDetail(c){if(!c){$('detail').innerHTML='<div class="detail-empty"><div><b>销售 CRM</b>从左侧优先级选择客户，查看销售资料与下一步行动。</div></div>';return}$('detail').innerHTML=`<header class="person-head"><span class="${avatarClass(c)}">${esc(initials(c))}</span><div class="person-info"><h1>${esc(c.name||c.whatsapp_phone||'未命名客户')}</h1><div class="person-sub">${esc(c.whatsapp_phone||'无电话')}　│　⌖ ${esc(c.location_summary||'地区未知')}</div><div class="person-badges"><span class="badge ${esc(c.lead_temperature||'cold')}">${esc(c.lead_temperature_label||'咨询客户')}</span><span class="badge warm">资格分 ${c.qualification_score||0}</span><span class="badge cold">${esc(c.sales_stage_label||'新线索')}</span></div></div><div class="head-actions"><a class="btn primary" href="${chatUrl(c.session_id)}">打开客服对话</a><button class="btn done" id="mark-done">✓ 标记完成</button><button class="btn" id="refresh-summary">更新摘要</button></div></header><div class="detail-body"><section class="card wide"><h2>▣ 客户概览</h2><div class="overview"><div class="prop"><label>地区</label><div>${esc(c.location_summary||req(c,'state','待确认'))}</div></div><div class="prop"><label>交付方式</label><div>${esc(req(c,'delivery_type','待确认'))}</div></div><div class="prop"><label>预算</label><div>${esc(budget(c))}</div></div><div class="prop"><label>户型</label><div>${esc(req(c,'bedrooms','待确认'))}${req(c,'bedrooms','')?' 卧室':''}</div></div><div class="prop"><label>土地面积</label><div>${esc(req(c,'lot_size_m2','待确认'))}${req(c,'lot_size_m2','')?' m²':''}</div></div><div class="prop"><label>计划时间</label><div>${esc(req(c,'timeline','待确认'))}</div></div></div></section><section class="card"><h2>✦ AI 销售摘要 <span>${c.ai_summary_updated_at?'已生成':'待生成'}</span></h2><div class="summary">${esc(c.ai_summary||'尚未生成摘要。可点击右上角“更新摘要”。')}</div><div class="summary-foot">分类依据：${esc((c.lead_priority_reasons||[]).join("；")||"当前以一般咨询和已收集资料为依据")}</div></section><section class="card"><h2>● 下一步行动</h2><div class="field"><label>销售阶段</label><select id="d-stage">${stages.map(s=>`<option value="${esc(s.code)}" ${s.code===c.sales_stage?'selected':''}>${esc(s.label)}</option>`).join('')}</select></div><div class="field"><label>行动内容</label><textarea id="d-action">${esc(c.next_action||'')}</textarea></div><div class="field"><label>跟进时间</label><input id="d-due" type="datetime-local" value="${esc(isoLocal(c.follow_up_due_at))}" /></div><div class="auto-row"><label><input id="d-stage-auto" type="checkbox" ${c.sales_stage_manual?'':'checked'}> 自动阶段</label><label><input id="d-action-auto" type="checkbox" ${c.next_action_manual?'':'checked'}> 自动行动</label><label><input id="d-due-auto" type="checkbox" ${c.follow_up_due_manual?'':'checked'}> 自动时间</label></div><div class="action-bar"><button class="btn primary" id="save">保存 CRM</button><span class="save-state" id="save-state"></span></div></section><section class="card"><h2>? 待确认信息 <span>${(c.qualification_missing||[]).length} 项</span></h2><div class="missing">${(c.qualification_missing||[]).length?(c.qualification_missing||[]).map(x=>`<span class="chip">${esc(x)}</span>`).join(''):'<span class="chip" style="background:var(--mint);color:var(--forest)">资料已完整</span>'}</div></section><section class="card"><h2>◷ 最近活动</h2><ul class="timeline">${historyItems(c)}</ul></section></div>`;$('save').onclick=saveDetail;$('mark-done').onclick=markDone;$('refresh-summary').onclick=refreshSummary}
    async function choose(id){const r=await authFetch(api('/contacts/'+encodeURIComponent(id)));if(!r.ok)return;selected=await r.json();renderList();renderDetail(selected)}async function patchSelected(body){if(!selected)return null;const r=await authFetch(api('/contacts/'+encodeURIComponent(selected.session_id)),{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok)throw new Error('保存失败');selected=await r.json();return selected}
    async function saveDetail(){const state=$('save-state');state.textContent='保存中…';try{const due=$('d-due').value;await patchSelected({sales_stage:$('d-stage').value,sales_stage_auto:$('d-stage-auto').checked,next_action:$('d-action').value.trim(),next_action_auto:$('d-action-auto').checked,follow_up_due_at:due?new Date(due).toISOString():'',follow_up_due_auto:$('d-due-auto').checked});state.textContent='已保存';await load(false);renderDetail(selected)}catch(e){state.textContent='保存失败'}}async function markDone(){if(!selected)return;await patchSelected({sales_stage:'closed',sales_stage_auto:false,next_action:'已完成',next_action_auto:false});await load(false);renderDetail(selected)}async function refreshSummary(){if(!selected)return;const b=$('refresh-summary');b.disabled=true;b.textContent='生成中…';try{const r=await authFetch(api('/contacts/'+encodeURIComponent(selected.session_id)+'/ai-summary'),{method:'POST'});if(r.ok){selected=await r.json();renderDetail(selected)}}finally{if($('refresh-summary')){$('refresh-summary').disabled=false;$('refresh-summary').textContent='更新摘要'}}}
    async function load(keep=true){try{const catUrl=source==='legacy'?'/api/legacy/contacts/categories':'/api/contacts/categories';const[cr,tr,cat]=await Promise.all([authFetch(api('/contacts')),source==='legacy'?Promise.resolve({json:async()=>({tasks:[]})}):authFetch('/api/tasks'),authFetch(catUrl)]);contacts=(await cr.json()).contacts||[];tasks=(await tr.json()).tasks||[];stages=(await cat.json()).sales_stages||[];$('error').style.display='none';if(!selected&&requestedSession){const target=contacts.find(c=>c.session_id===requestedSession);if(target){queue=target.sales_stage==='closed'?'completed':'all';renderList();await choose(target.session_id);return}}renderList();if(keep&&selected)await choose(selected.session_id);else if(!selected&&visibleContacts()[0])await choose(visibleContacts()[0].session_id)}catch(e){$('error').textContent='数据加载失败，请刷新或重新登录。';$('error').style.display='block'}}function setQueue(q){queue=q;renderList();const first=visibleContacts()[0];if(first)choose(first.session_id);else{selected=null;renderDetail(null)}}
    $('queue-list').onclick=e=>{const b=e.target.closest('[data-queue]');if(b)setQueue(b.dataset.queue)};$('stage-list').onclick=e=>{const b=e.target.closest('[data-queue]');if(b)setQueue(b.dataset.queue)};$('lead-list').onclick=e=>{const b=e.target.closest('[data-id]');if(b)choose(b.dataset.id)};$('search').oninput=renderList;$('global-search').oninput=e=>{$('search').value=e.target.value;queue='all';renderList()};$('sort').onchange=renderList;$('filter-toggle').onclick=()=>{followupOnly=!followupOnly;$('filter-toggle').style.background=followupOnly?'var(--mint)':'#fff';renderList()};
    function applySourceUI(){$('workspace-picker').textContent=source==='legacy'?'老号码　⌄':'新号码　⌄';document.querySelectorAll('#queue-list [data-queue]').forEach(b=>{b.style.display=(source==='legacy'&&['reply','today','overdue'].includes(b.dataset.queue))?'none':''});if(['reply','today','overdue'].includes(queue))queue='all'}
    $('workspace-picker').onclick=async()=>{source=source==='legacy'?'new':'legacy';selected=null;applySourceUI();await load(false)};
    (async()=>{const r=await fetch('/api/admin/session',{credentials:'same-origin'});if(r.ok){const s=await r.json();if(s.auth_required&&!s.authenticated){location.href='/admin/login?next='+encodeURIComponent('/crm');return}}const urlSource=new URLSearchParams(location.search).get('source');if(urlSource==='legacy'||urlSource==='new'){source=urlSource;applySourceUI()}await load(false)})();
  </script>
</body>
